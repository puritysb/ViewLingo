name: Check public README links
on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/README-*.md', 'tests/readme-links.test.cjs', '.github/workflows/readme.yml']
  pull_request:
    paths: ['README.md', 'docs/README-*.md', 'tests/readme-links.test.cjs', '.github/workflows/readme.yml']

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/readme-links.test.cjs
